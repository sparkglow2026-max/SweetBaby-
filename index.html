<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sweet Baby</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Pacifico&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: none;
      color: #333;
      overflow-x: hidden;
    }

    header {
      width: 100%;
      min-height: 90vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      position: relative;
    }

    .hero {
      max-width: 700px;
      animation: fadeIn 2s ease;
    }

    .logo {
      font-size: 70px;
      font-family: 'Pacifico', cursive;
      color: #ff4f81;
      margin-bottom: 20px;
      text-shadow: 2px 2px 10px rgba(255, 79, 129, 0.3);
    }

    .hero h2 {
      font-size: 32px;
      margin-bottom: 15px;
      color: #444;
    }

    .hero p {
      font-size: 18px;
      line-height: 1.7;
      color: #666;
      margin-bottom: 30px;
    }

    /* Explore Button */
    .btn {
      display: inline-block;
      padding: 14px 35px;
      background: black;
      color: white;
      text-decoration: none;
      border-radius: 50px;
      font-size: 18px;
      font-weight: 600;
      transition: 0.3s ease;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }

    .btn:hover {
      transform: translateY(-3px);
      background: #222;
    }

    /* Social Media Icons */
    .social-icons {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      margin-top: -40px;
      margin-bottom: 10px;
    }

    .social-btn {
      color: black;
      text-decoration: none;
      font-size: 32px;
      transition: 0.3s ease;
    }

    .social-btn:hover {
      transform: scale(1.2);
      color: #ff4f81;
    }

    footer {
      text-align: center;
      padding: 10px;
      color: #333;
      font-size: 16px;
      margin-top: 0;
    }

    /* Bubble Animation */
    .bubble {
      position: absolute;
      border-radius: 50%;
      background: rgba(255,255,255,0.5);
      animation: float 8s infinite ease-in-out;
    }

    .bubble:nth-child(1) {
      width: 80px;
      height: 80px;
      top: 10%;
      left: 10%;
    }

    .bubble:nth-child(2) {
      width: 120px;
      height: 120px;
      bottom: 15%;
      right: 10%;
      animation-delay: 2s;
    }

    .bubble:nth-child(3) {
      width: 60px;
      height: 60px;
      top: 70%;
      left: 20%;
      animation-delay: 4s;
    }

    @keyframes float {
      0% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-20px);
      }
      100% {
        transform: translateY(0px);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media(max-width: 768px) {
      .logo {
        font-size: 50px;
      }

      .hero h2 {
        font-size: 24px;
      }

      .hero p {
        font-size: 16px;
      }

      .social-btn {
        font-size: 28px;
      }
    }
  </style>
</head>

<body>

  <header>

    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>

    <div class="hero">

      <div class="logo">Sweet Baby</div>

      <h2>Welcome to the Sweetest Place Online</h2>

      <p>
        Sweet Baby is a beautiful and cute website made with love,
        soft colors, and a modern design.
      </p>

      <!-- Explore Button -->
      <a href="explore.html" class="btn">Explore More</a>

    </div>

  </header>

  <!-- Social Media Icons -->
  <div class="social-icons">

    <!-- Facebook -->
    <a href="https://www.facebook.com/yourprofile"
       target="_blank"
       class="social-btn">
      <i class="fab fa-facebook-f"></i>
    </a>

    <!-- Instagram -->
    <a href="https://www.instagram.com/yourprofile"
       target="_blank"
       class="social-btn">
      <i class="fab fa-instagram"></i>
    </a>

    <!-- Twitter / X -->
    <a href="https://twitter.com/yourprofile"
       target="_blank"
       class="social-btn">
      <i class="fab fa-x-twitter"></i>
    </a>

    <!-- YouTube -->
    <a href="https://www.youtube.com/@yourchannel"
       target="_blank"
       class="social-btn">
      <i class="fab fa-youtube"></i>
    </a>

  </div>

  <footer>
    © 2026 Sweet Baby | All Rights Reserved
  </footer>

</body>
</html>
